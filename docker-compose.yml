services:
  db:
    image: postgres:16-alpine
    container_name: olt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: olt
      POSTGRES_PASSWORD: oltpassword
      POSTGRES_DB: olt_commander
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olt -d olt_commander"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: olt-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://olt:oltpassword@db:5432/olt_commander
      JWT_SECRET: change-me-in-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SCAN_OLT_INTERVAL: "300"
      SCAN_MIKROTIK_INTERVAL: "300"
      BIND_INTERVAL: "300"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: olt-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata: